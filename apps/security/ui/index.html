<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>WASP — GREEN / SECURITY</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --g:#39FF14; --g2:#12c25a; --gd:#063b1c; --bg:#020805; --ink:#d9ffe9; --dim:#4f9c6b;
    --warn:#ffd23f; --bad:#ff3b5c; --cyan:#00F0FF; --mag:#FF2BD6; --org:#FF7A00;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
  #stage{position:relative;height:100%;display:grid;grid-template-columns:1fr 440px;gap:0}
  /* ---------- FACE ---------- */
  #face-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  #face{width:min(58vh,560px);height:min(58vh,560px);filter:drop-shadow(0 0 18px var(--g)) drop-shadow(0 0 60px rgba(57,255,20,.35));transition:filter .3s}
  #face .base{fill:#e9fff1;stroke:var(--g);stroke-width:3}
  #face .line{stroke:var(--g);stroke-width:3;fill:none}
  #face .eye{fill:var(--g);filter:drop-shadow(0 0 8px var(--g))}
  #face .pupil{fill:#03130a}
  #face .mouth{fill:none;stroke:var(--g);stroke-width:6;stroke-linecap:square}
  #face .plate{fill:#0b2a18;stroke:var(--g2);stroke-width:2}
  #face .tick{stroke:var(--g2);stroke-width:2}
  #label{margin-top:18px;letter-spacing:.35em;font-size:14px;color:var(--dim)}
  #state{margin-top:6px;font-size:34px;letter-spacing:.2em;font-weight:700;color:var(--g);text-shadow:0 0 14px var(--g)}
  #detail{margin-top:4px;font-size:13px;color:var(--dim);min-height:1.4em}
  body[data-state="PERMISSION_REQUIRED"] #face{filter:drop-shadow(0 0 28px var(--warn)) drop-shadow(0 0 90px rgba(255,210,63,.45))}
  body[data-state="PERMISSION_REQUIRED"] #state{color:var(--warn);text-shadow:0 0 14px var(--warn);animation:pulse .9s infinite alternate}
  body[data-state="PERMISSION_REQUIRED"] #face .eye,body[data-state="PERMISSION_REQUIRED"] #face .mouth{fill:var(--warn);stroke:var(--warn)}
  body[data-state="DENIED"] #face,body[data-state="BLOCKED"] #face{filter:drop-shadow(0 0 28px var(--bad)) drop-shadow(0 0 90px rgba(255,59,92,.45))}
  body[data-state="DENIED"] #state,body[data-state="BLOCKED"] #state{color:var(--bad);text-shadow:0 0 14px var(--bad)}
  body[data-state="DENIED"] #face .eye,body[data-state="BLOCKED"] #face .eye{fill:var(--bad)}
  body[data-state="BLOCKED"] #face .mouth{stroke:var(--bad)}
  body[data-state="WARNING"] #state{color:var(--warn);text-shadow:0 0 14px var(--warn)}
  body[data-state="AUTHORIZED"] #face{filter:drop-shadow(0 0 34px var(--g)) drop-shadow(0 0 120px rgba(57,255,20,.6))}
  body[data-state="OFFLINE"] #face{filter:grayscale(1) brightness(.4)}
  body[data-state="OFFLINE"] #state{color:#555;text-shadow:none}
  body[data-state="IDLE"] #face .eye,body[data-state="MONITORING"] #face .eye{animation:blink 5s infinite}
  body[data-state="REVIEWING"] #face .eye{animation:scan 1.1s infinite alternate ease-in-out}
  @keyframes pulse{from{opacity:1}to{opacity:.55}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes scan{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
  #face .eye{transform-box:fill-box;transform-origin:center}
  .glitch{animation:glitch .35s steps(2) 1}
  @keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-6px,2px) skewX(6deg)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,1px) skewX(-4deg)}80%{transform:translate(4px,2px)}100%{transform:translate(0)}}
  /* ---------- WINDOWS ---------- */
  #panels{display:flex;flex-direction:column;gap:12px;padding:16px;overflow:hidden;border-left:1px solid var(--gd)}
  .win{border:1px solid var(--g2);background:rgba(3,20,10,.85);box-shadow:0 0 18px rgba(57,255,20,.12) inset,0 0 10px rgba(57,255,20,.15);display:flex;flex-direction:column;min-height:0}
  .win h3{margin:0;padding:6px 10px;font-size:11px;letter-spacing:.3em;color:var(--g);border-bottom:1px solid var(--gd);background:rgba(57,255,20,.07);display:flex;justify-content:space-between}
  .win .body{padding:8px 10px;font-size:12px;overflow:auto;line-height:1.45}
  #review{flex:0 0 auto} #review .body{font-size:13px}
  #review .kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px} #review .kv b{color:var(--dim);font-weight:400}
  .risk-LOW{color:var(--g)} .risk-MEDIUM{color:var(--warn)} .risk-HIGH{color:var(--org)} .risk-CRITICAL{color:var(--bad)}
  #review .banner{margin-top:8px;padding:6px;text-align:center;letter-spacing:.2em;border:1px dashed var(--warn);color:var(--warn)}
  #review .banner.ok{border-color:var(--g);color:var(--g)} #review .banner.bad{border-color:var(--bad);color:var(--bad)}
  #buttons{display:flex;gap:6px;margin-top:8px}
  #buttons button{flex:1;background:transparent;border:1px solid var(--g2);color:var(--ink);font-family:inherit;padding:6px;cursor:pointer;letter-spacing:.15em}
  #buttons button:hover{background:rgba(57,255,20,.12)} #buttons button[disabled]{opacity:.3;cursor:default}
  #comms{flex:1 1 30%} #perms{flex:1 1 25%} #audit{flex:1 1 35%}
  .msg{margin:2px 0} .msg .who{font-weight:700}
  .c-security{color:var(--g)} .c-architect{color:var(--cyan)} .c-researcher{color:var(--mag)} .c-operator{color:var(--org)} .c-human{color:#fff} .c-hub{color:var(--dim)} .c-all{color:var(--dim)}
  .row{display:grid;grid-template-columns:70px 1fr 100px;gap:6px;border-bottom:1px dotted var(--gd);padding:2px 0}
  .st-GRANTED,.st-AUTO_APPROVED,.st-success{color:var(--g)} .st-PENDING,.st-AWAITING_HUMAN,.st-info{color:var(--warn)} .st-DENIED,.st-CANCELLED,.st-BLOCKED,.st-EXPIRED,.st-denied,.st-cancelled,.st-failure,.st-unavailable{color:var(--bad)}
  #conn{position:fixed;left:14px;bottom:10px;font-size:11px;color:var(--dim);letter-spacing:.1em} #conn.on{color:var(--g)}
  #proc{position:fixed;left:14px;bottom:26px;font-size:11px;color:var(--dim);letter-spacing:.1em}
</style>
</head>
<body data-state="OFFLINE">
<div id="stage">
  <div id="face-wrap">
    <svg id="face" viewBox="0 0 400 400" aria-label="GREEN WASP face">
      <polygon class="base" points="200,18 352,92 352,286 200,382 48,286 48,92"/>
      <polygon class="plate" points="200,48 322,108 322,270 200,346 78,270 78,108"/>
      <polyline class="line" points="110,140 170,130 200,150 230,130 290,140"/>
      <g id="eyeL"><rect class="eye" x="118" y="160" width="62" height="34"/><rect class="pupil" x="140" y="170" width="18" height="14"/></g>
      <g id="eyeR"><rect class="eye" x="220" y="160" width="62" height="34"/><rect class="pupil" x="242" y="170" width="18" height="14"/></g>
      <polyline class="line" points="200,196 190,232 210,232 200,196"/>
      <g id="mouth">
        <line class="mouth" x1="140" y1="280" x2="170" y2="280"/>
        <line class="mouth" x1="185" y1="280" x2="215" y2="280"/>
        <line class="mouth" x1="230" y1="280" x2="260" y2="280"/>
      </g>
      <g class="tick">
        <line x1="60" y1="150" x2="78" y2="150"/><line x1="60" y1="200" x2="78" y2="200"/><line x1="60" y1="250" x2="78" y2="250"/>
        <line x1="322" y1="150" x2="340" y2="150"/><line x1="322" y1="200" x2="340" y2="200"/><line x1="322" y1="250" x2="340" y2="250"/>
      </g>
    </svg>
    <div id="label">WASP · GREEN · SECURITY / AUDITOR</div>
    <div id="state">OFFLINE</div>
    <div id="detail"></div>
  </div>

  <div id="panels">
    <div class="win" id="review">
      <h3><span>SECURITY REVIEW</span><span id="review-count"></span></h3>
      <div class="body">
        <div id="review-empty" style="color:var(--dim)">No pending operations. Monitoring.</div>
        <div id="review-content" style="display:none">
          <div class="kv">
            <b>AGENT</b><span id="rv-agent"></span>
            <b>ACTION</b><span id="rv-action"></span>
            <b>RISK</b><span id="rv-risk"></span>
            <b>REASON</b><span id="rv-reason"></span>
            <b>PROMPT</b><span id="rv-prompt" style="color:var(--dim)"></span>
          </div>
          <div class="banner" id="rv-banner">HUMAN APPROVAL REQUIRED</div>
          <div id="buttons">
            <button data-decision="YES" data-raw="sí">SÍ</button>
            <button data-decision="NO" data-raw="no">NO</button>
            <button data-decision="STOP" data-raw="stop">STOP</button>
          </div>
        </div>
      </div>
    </div>
    <div class="win" id="comms"><h3><span>AGENT COMMUNICATION</span></h3><div class="body"></div></div>
    <div class="win" id="perms"><h3><span>PERMISSIONS</span></h3><div class="body"></div></div>
    <div class="win" id="audit"><h3><span>AUDIT</span><span id="audit-count">0</span></h3><div class="body"></div></div>
  </div>
</div>
<div id="proc">● security process: unknown</div>
<div id="conn">● CONNECTING</div>

<script>
/* GREEN face — a passive viewer of the shared WASP event stream (docs/CONTRACT.md).
   Connects to the hub as `security` with meta.role = 'ui'. Human buttons go through the hub's
   HTTP bridge as `user_authorization` from `human` — the UI never emits domain events itself. */
const $ = (s)=>document.querySelector(s);
const params = new URLSearchParams(location.search);
const HUB = params.get('hub') || ('__WASP_HUB_URL__'.startsWith('ws') ? '__WASP_HUB_URL__' : `ws://${location.hostname}:7331`);
const HTTP = HUB.replace(/^ws/, 'http');

const state = { permissions:new Map(), pending:null, auditIds:new Set() };

function setFace(s, detail){
  document.body.dataset.state = s; $('#state').textContent = s; $('#detail').textContent = detail || '';
  const f = $('#face'); f.classList.remove('glitch'); void f.offsetWidth; f.classList.add('glitch');
}
function addMsg(from,to,text){
  const b = $('#comms .body'); const d = document.createElement('div'); d.className='msg';
  d.innerHTML = `<span class="who c-${from}">${from.toUpperCase()}</span> → <span class="who c-${to}">${String(to).toUpperCase()}</span><br>&nbsp;&nbsp;"${esc(text)}"`;
  b.appendChild(d); b.scrollTop = b.scrollHeight; while (b.children.length > 60) b.removeChild(b.firstChild);
}
function renderPerms(){
  const b = $('#perms .body'); b.innerHTML='';
  [...state.permissions.values()].slice(-12).reverse().forEach(p=>{
    const r = document.createElement('div'); r.className='row';
    r.innerHTML = `<span class="c-${p.requested_by}">${p.requested_by}</span><span>${esc(p.operation)} <span class="risk-${p.risk||''}">${p.risk||''}</span></span><span class="st-${p.status}">${p.status}</span>`;
    b.appendChild(r);
  });
  const pending = [...state.permissions.values()].filter(p=>p.status==='AWAITING_HUMAN');
  $('#review-count').textContent = pending.length ? `${pending.length} PENDING` : '';
  showReview(pending.length ? pending[pending.length-1] : (state.pending && state.pending.status !== 'AWAITING_HUMAN' ? state.pending : null));
}
function showReview(p){
  state.pending = p;
  $('#review-empty').style.display = p?'none':'block'; $('#review-content').style.display = p?'block':'none';
  if(!p) return;
  $('#rv-agent').textContent = String(p.requested_by).toUpperCase(); $('#rv-action').textContent = p.operation;
  const rk = $('#rv-risk'); rk.textContent = p.risk || '?'; rk.className = 'risk-'+(p.risk||'');
  $('#rv-reason').textContent = p.reason || ''; $('#rv-prompt').textContent = p.human_prompt || '';
  const banner = $('#rv-banner'); banner.className='banner'; const btns = $('#buttons').querySelectorAll('button');
  if(p.status==='AWAITING_HUMAN'){ banner.textContent='HUMAN APPROVAL REQUIRED'; btns.forEach(x=>x.disabled=false); }
  else { banner.textContent = p.status + (p.human_raw ? ` · human: "${p.human_raw}"` : ''); banner.classList.add(p.status==='GRANTED'||p.status==='AUTO_APPROVED'?'ok':'bad'); btns.forEach(x=>x.disabled=true); if(p.status!=='AWAITING_HUMAN') setTimeout(()=>{ if(state.pending===p) showReview(null); }, 4000); }
}
function addAudit(e){
  if(state.auditIds.has(e.id)) return; state.auditIds.add(e.id); $('#audit-count').textContent = state.auditIds.size;
  const b = $('#audit .body'); const r = document.createElement('div'); r.className='row';
  r.innerHTML = `<span style="color:var(--dim)">${(e.timestamp||'').slice(11,19)}</span><span><span class="c-${e.agent}">${e.agent}</span> ${esc(e.action)} <span style="color:var(--dim)">${e.tool&&e.tool!==e.action?e.tool:''}${e.risk_level?` · ${e.risk_level}`:''}${e.user_authorization?` · human:"${esc(e.user_authorization)}"`:''}${e.stub?' · STUB':''}</span></span><span class="st-${e.status}">${e.status}${e.approval_status?`<br><small class="st-${e.approval_status}">${e.approval_status}</small>`:''}</span>`;
  b.appendChild(r); b.scrollTop = b.scrollHeight; while (b.children.length > 80) b.removeChild(b.firstChild);
}
function applyContext(ctx){
  state.permissions = new Map((ctx.permissions||[]).map(p=>[p.permission_id,p])); renderPerms();
  (ctx.audit||[]).forEach(addAudit);
  const me = ctx.agents && ctx.agents.security;
  $('#proc').textContent = me && me.status==='online' ? `● security process: ONLINE${me.mode==='stub'?' (STUB)':''}` : '● security process: OFFLINE';
  if(ctx.agent_states && ctx.agent_states.security) setFace(ctx.agent_states.security);
}

function onEvent(ev){
  const p = ev.payload||{};
  switch(ev.type){
    case 'session_snapshot': applyContext(p.context); break;
    case 'context_updated': applyContext(p.context); return;
    case 'agent_state': if(p.agent==='security') setFace(p.state,p.detail); break;
    case 'agent_message': addMsg(ev.from, ev.to, p.message); break;
    case 'user_message': addMsg('human','all',p.text); break;
    case 'user_authorization': addMsg('human','security',p.raw); break;
    case 'permission_requested': upsert(p.permission_id, {...p, status:'PENDING'}); break;
    case 'permission_required': upsert(p.permission_id, {operation:p.operation, risk:p.risk, approval_required:p.approval_required, human_prompt:p.human_prompt, status:p.approval_required?'AWAITING_HUMAN':'AUTO_APPROVED'}); break;
    case 'permission_granted': case 'permission_denied': case 'permission_cancelled': upsert(p.permission_id, p); break;
    case 'audit_event': addAudit(p); break;
    case 'hub_error': addMsg('hub','security',p.message); break;
  }
}
function upsert(id, patch){ const prev = state.permissions.get(id) || { permission_id:id, requested_by:'operator' }; state.permissions.set(id, {...prev, ...patch}); renderPerms(); }
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

$('#buttons').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button'); if(!btn||!state.pending||state.pending.status!=='AWAITING_HUMAN') return;
  const p = state.pending;
  // Human input enters WASP through the hub's HTTP bridge, as `human` (apps/hub/src/index.ts POST /events).
  await fetch(`${HTTP}/events`, { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ type:'user_authorization', from:'human', to:'security', correlation_id:p.permission_id,
      payload:{ permission_id:p.permission_id, decision:btn.dataset.decision, raw:btn.dataset.raw, channel:'ui' } }) }).catch(err=>addMsg('hub','security',`could not reach hub: ${err.message}`));
});

function connect(){
  const ws = new WebSocket(HUB);
  ws.onopen=()=>{ ws.send(JSON.stringify({ type:'agent_registered', from:'security', to:'hub', payload:{ agent:'security', mode:'real', meta:{ role:'ui' } } }));
    $('#conn').textContent='● HUB '+HUB; $('#conn').classList.add('on'); };
  ws.onclose=()=>{ $('#conn').textContent='● DISCONNECTED — retrying'; $('#conn').classList.remove('on'); setFace('OFFLINE','hub connection lost'); setTimeout(connect,1500); };
  ws.onmessage=(m)=>{ try{ onEvent(JSON.parse(m.data)); }catch(err){ console.error(err); } };
}
connect();
</script>
</body>
</html>
