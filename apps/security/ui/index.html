<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>WASP — GREEN / SECURITY</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --g:#39ff88; --g2:#12c25a; --gd:#063b1c; --bg:#020805; --ink:#d9ffe9; --dim:#4f9c6b;
    --warn:#ffd23f; --bad:#ff3b5c; --cyan:#3ff5ff; --mag:#ff4fd8; --org:#ff9a2e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;overflow:hidden}
  body::before{ /* scanlines */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply}
  body::after{ /* vignette + phosphor glow */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
  #stage{position:relative;height:100%;display:grid;grid-template-columns:1fr 420px;gap:0}
  /* ---------- FACE ---------- */
  #face-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  #face{width:min(58vh,560px);height:min(58vh,560px);filter:drop-shadow(0 0 18px var(--g)) drop-shadow(0 0 60px rgba(57,255,136,.35));transition:filter .3s}
  #face .base{fill:#e9fff1;stroke:var(--g);stroke-width:3}
  #face .line{stroke:var(--g);stroke-width:3;fill:none}
  #face .eye{fill:var(--g);filter:drop-shadow(0 0 8px var(--g))}
  #face .pupil{fill:#03130a}
  #face .mouth{fill:none;stroke:var(--g);stroke-width:6;stroke-linecap:square}
  #face .plate{fill:#0b2a18;stroke:var(--g2);stroke-width:2}
  #face .tick{stroke:var(--g2);stroke-width:2}
  #label{margin-top:18px;letter-spacing:.35em;font-size:14px;color:var(--dim)}
  #state{margin-top:6px;font-size:34px;letter-spacing:.2em;font-weight:700;color:var(--g);text-shadow:0 0 14px var(--g)}
  #detail{margin-top:4px;font-size:13px;color:var(--dim);min-height:1.4em}
  /* state palettes */
  body[data-state="PERMISSION_REQUIRED"] #face{filter:drop-shadow(0 0 28px var(--warn)) drop-shadow(0 0 90px rgba(255,210,63,.45))}
  body[data-state="PERMISSION_REQUIRED"] #state{color:var(--warn);text-shadow:0 0 14px var(--warn);animation:pulse .9s infinite alternate}
  body[data-state="PERMISSION_REQUIRED"] #face .eye,body[data-state="PERMISSION_REQUIRED"] #face .mouth{fill:var(--warn);stroke:var(--warn)}
  body[data-state="DENIED"] #face,body[data-state="BLOCKED"] #face{filter:drop-shadow(0 0 28px var(--bad)) drop-shadow(0 0 90px rgba(255,59,92,.45))}
  body[data-state="DENIED"] #state,body[data-state="BLOCKED"] #state{color:var(--bad);text-shadow:0 0 14px var(--bad)}
  body[data-state="DENIED"] #face .eye,body[data-state="BLOCKED"] #face .eye{fill:var(--bad)}
  body[data-state="BLOCKED"] #face .mouth{stroke:var(--bad)}
  body[data-state="WARNING"] #state{color:var(--warn);text-shadow:0 0 14px var(--warn)}
  body[data-state="AUTHORIZED"] #face{filter:drop-shadow(0 0 34px var(--g)) drop-shadow(0 0 120px rgba(57,255,136,.6))}
  body[data-state="OFFLINE"] #face{filter:grayscale(1) brightness(.4)}
  body[data-state="OFFLINE"] #state{color:#555;text-shadow:none}
  body[data-state="IDLE"] #face .eye{animation:blink 5s infinite}
  body[data-state="REVIEWING"] #face .eye{animation:scan 1.1s infinite alternate ease-in-out}
  @keyframes pulse{from{opacity:1}to{opacity:.55}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes scan{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
  #face .eye{transform-box:fill-box;transform-origin:center}
  /* glitch */
  .glitch{animation:glitch .35s steps(2) 1}
  @keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-6px,2px) skewX(6deg)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,1px) skewX(-4deg)}80%{transform:translate(4px,2px)}100%{transform:translate(0)}}
  /* ---------- WINDOWS ---------- */
  #panels{display:flex;flex-direction:column;gap:12px;padding:16px;overflow:hidden;border-left:1px solid var(--gd)}
  .win{border:1px solid var(--g2);background:rgba(3,20,10,.85);box-shadow:0 0 18px rgba(57,255,136,.12) inset,0 0 10px rgba(57,255,136,.15);display:flex;flex-direction:column;min-height:0}
  .win h3{margin:0;padding:6px 10px;font-size:11px;letter-spacing:.3em;color:var(--g);border-bottom:1px solid var(--gd);background:rgba(57,255,136,.07);display:flex;justify-content:space-between}
  .win .body{padding:8px 10px;font-size:12px;overflow:auto;line-height:1.45}
  #review{flex:0 0 auto}
  #review .body{font-size:13px}
  #review .kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px}
  #review .kv b{color:var(--dim);font-weight:400}
  #review .risk-LOW{color:var(--g)} #review .risk-MEDIUM{color:var(--warn)} #review .risk-HIGH{color:var(--org)} #review .risk-CRITICAL{color:var(--bad)}
  #review .banner{margin-top:8px;padding:6px;text-align:center;letter-spacing:.2em;border:1px dashed var(--warn);color:var(--warn)}
  #review .banner.ok{border-color:var(--g);color:var(--g)} #review .banner.bad{border-color:var(--bad);color:var(--bad)}
  #buttons{display:flex;gap:6px;margin-top:8px}
  #buttons button{flex:1;background:transparent;border:1px solid var(--g2);color:var(--ink);font-family:inherit;padding:6px;cursor:pointer;letter-spacing:.15em}
  #buttons button:hover{background:rgba(57,255,136,.12)}
  #buttons button[disabled]{opacity:.3;cursor:default}
  #comms{flex:1 1 30%} #perms{flex:1 1 25%} #audit{flex:1 1 35%}
  .msg{margin:2px 0} .msg .who{font-weight:700}
  .c-security{color:var(--g)} .c-architect{color:var(--cyan)} .c-researcher{color:var(--mag)} .c-operator{color:var(--org)} .c-human{color:#fff} .c-system{color:var(--dim)}
  .row{display:grid;grid-template-columns:70px 1fr 90px;gap:6px;border-bottom:1px dotted var(--gd);padding:2px 0}
  .st-GRANTED,.st-granted,.st-success{color:var(--g)} .st-PENDING,.st-pending_approval,.st-warning{color:var(--warn)} .st-DENIED,.st-CANCELLED,.st-BLOCKED,.st-denied,.st-cancelled,.st-blocked,.st-failure,.st-unavailable{color:var(--bad)}
  #conn{position:fixed;left:14px;bottom:10px;font-size:11px;color:var(--dim);letter-spacing:.1em}
  #conn.on{color:var(--g)}
</style>
</head>
<body data-state="IDLE">
<div id="stage">
  <div id="face-wrap">
    <svg id="face" viewBox="0 0 400 400" aria-label="GREEN WASP face">
      <!-- geometric mask: original design -->
      <polygon class="base" points="200,18 352,92 352,286 200,382 48,286 48,92"/>
      <polygon class="plate" points="200,48 322,108 322,270 200,346 78,270 78,108"/>
      <!-- brow lines -->
      <polyline class="line" points="110,140 170,130 200,150 230,130 290,140"/>
      <!-- eyes -->
      <g id="eyeL"><rect class="eye" x="118" y="160" width="62" height="34"/><rect class="pupil" x="140" y="170" width="18" height="14"/></g>
      <g id="eyeR"><rect class="eye" x="220" y="160" width="62" height="34"/><rect class="pupil" x="242" y="170" width="18" height="14"/></g>
      <!-- nose ridge -->
      <polyline class="line" points="200,196 190,232 210,232 200,196"/>
      <!-- mouth: segmented bar -->
      <g id="mouth">
        <line class="mouth" x1="140" y1="280" x2="170" y2="280"/>
        <line class="mouth" x1="185" y1="280" x2="215" y2="280"/>
        <line class="mouth" x1="230" y1="280" x2="260" y2="280"/>
      </g>
      <!-- side ticks -->
      <g class="tick">
        <line x1="60" y1="150" x2="78" y2="150"/><line x1="60" y1="200" x2="78" y2="200"/><line x1="60" y1="250" x2="78" y2="250"/>
        <line x1="322" y1="150" x2="340" y2="150"/><line x1="322" y1="200" x2="340" y2="200"/><line x1="322" y1="250" x2="340" y2="250"/>
      </g>
    </svg>
    <div id="label">WASP · GREEN · SECURITY / AUDITOR</div>
    <div id="state">IDLE</div>
    <div id="detail"></div>
  </div>

  <div id="panels">
    <div class="win" id="review">
      <h3><span>SECURITY REVIEW</span><span id="review-count"></span></h3>
      <div class="body">
        <div id="review-empty" style="color:var(--dim)">No pending operations. Monitoring.</div>
        <div id="review-content" style="display:none">
          <div class="kv">
            <b>AGENT</b><span id="rv-agent"></span>
            <b>ACTION</b><span id="rv-action"></span>
            <b>TOOL</b><span id="rv-tool"></span>
            <b>RISK</b><span id="rv-risk"></span>
            <b>REASON</b><span id="rv-reason"></span>
          </div>
          <div class="banner" id="rv-banner">HUMAN APPROVAL REQUIRED</div>
          <div id="buttons">
            <button data-answer="sí">SÍ</button>
            <button data-answer="no">NO</button>
            <button data-answer="stop">STOP</button>
          </div>
        </div>
      </div>
    </div>
    <div class="win" id="comms"><h3><span>AGENT COMMUNICATION</span></h3><div class="body"></div></div>
    <div class="win" id="perms"><h3><span>PERMISSIONS</span></h3><div class="body"></div></div>
    <div class="win" id="audit"><h3><span>AUDIT</span><span id="audit-count">0</span></h3><div class="body"></div></div>
  </div>
</div>
<div id="conn">● DISCONNECTED</div>

<script>
/* ==========================================================================
   GREEN UI — consumes WaspEvent objects from the hub WebSocket and renders.
   Event shapes: packages/shared-types/src/events.ts
   Query params:
     ?hub=ws://host:port   connect to the hub (CYAN). Hub must broadcast WaspEvent JSON.
     ?demo=1               replay a scripted scenario locally (no hub)
   Human buttons publish:  { type:'user_message', source:'human',
                             payload:{ text, channel:'ui', in_reply_to_permission_id } }
   ========================================================================== */
const $ = (s)=>document.querySelector(s);
const params = new URLSearchParams(location.search);
const HUB = params.get('hub');
const DEMO = params.get('demo') === '1' || !HUB;

const state = { permissions:new Map(), pending:null, audit:0 };
let send = ()=>{};

function setFace(s, detail){
  document.body.dataset.state = s;
  $('#state').textContent = s;
  $('#detail').textContent = detail || '';
  const f = $('#face'); f.classList.remove('glitch'); void f.offsetWidth; f.classList.add('glitch');
}

function addMsg(from,to,text){
  const b = $('#comms .body');
  const d = document.createElement('div'); d.className='msg';
  d.innerHTML = `<span class="who c-${from}">${from.toUpperCase()}</span> → <span class="who c-${to}">${String(to).toUpperCase()}</span><br>&nbsp;&nbsp;"${esc(text)}"`;
  b.appendChild(d); b.scrollTop = b.scrollHeight;
}

function renderPerms(){
  const b = $('#perms .body'); b.innerHTML='';
  [...state.permissions.values()].slice(-12).reverse().forEach(p=>{
    const r = document.createElement('div'); r.className='row';
    r.innerHTML = `<span class="c-${p.agent}">${p.agent}</span><span>${esc(p.operation)} <span style="color:var(--dim)">(${p.tool}, ${p.risk_level})</span></span><span class="st-${p.status}">${p.status}</span>`;
    b.appendChild(r);
  });
}

function showReview(p){
  state.pending = p;
  $('#review-empty').style.display = p?'none':'block';
  $('#review-content').style.display = p?'block':'none';
  if(!p) return;
  $('#rv-agent').textContent = p.agent.toUpperCase();
  $('#rv-action').textContent = p.operation;
  $('#rv-tool').textContent = p.tool;
  const rk = $('#rv-risk'); rk.textContent = p.risk_level; rk.className = 'risk-'+p.risk_level;
  $('#rv-reason').textContent = p.reason;
  const banner = $('#rv-banner'); banner.className='banner';
  const btns = $('#buttons').querySelectorAll('button');
  if(p.status==='PENDING'){ banner.textContent='HUMAN APPROVAL REQUIRED'; btns.forEach(x=>x.disabled=false); }
  else { banner.textContent = p.status; banner.classList.add(p.status==='GRANTED'?'ok':'bad'); btns.forEach(x=>x.disabled=true); }
}

function addAudit(e){
  state.audit++; $('#audit-count').textContent = state.audit;
  const b = $('#audit .body');
  const r = document.createElement('div'); r.className='row';
  const t = (e.timestamp||'').slice(11,19);
  r.innerHTML = `<span style="color:var(--dim)">${t}</span><span><span class="c-${e.agent}">${e.agent}</span> ${esc(e.action)} <span style="color:var(--dim)">${e.tool||''}${e.user_authorization?` · human:"${esc(e.user_authorization)}"`:''}</span></span><span class="st-${e.status}">${e.status}</span>`;
  b.appendChild(r); b.scrollTop = b.scrollHeight;
}

function onEvent(ev){
  const p = ev.payload||{};
  switch(ev.type){
    case 'agent_state_changed': if(p.agent==='security') setFace(p.state,p.detail); break;
    case 'agent_message': addMsg(p.from,p.to,p.message); break;
    case 'user_message': addMsg('human','wasp',p.text); break;
    case 'permission_requested':
    case 'permission_granted':
    case 'permission_denied':
    case 'permission_cancelled':
    case 'permission_expired':
      state.permissions.set(p.permission.permission_id,p.permission); renderPerms();
      if(p.permission.status==='PENDING') showReview(p.permission);
      else if(state.pending && state.pending.permission_id===p.permission.permission_id){ showReview(p.permission); setTimeout(()=>{ if(state.pending&&state.pending.status!=='PENDING') showReview(null); },3500); }
      break;
    case 'tool_blocked':
      showReview({agent:p.request.agent,operation:p.request.operation,tool:p.request.tool,risk_level:p.risk_level,reason:p.reason,status:'BLOCKED'});
      setTimeout(()=>showReview(null),4000); break;
    case 'audit_event': addAudit(p.entry); break;
  }
  // when the hub does not forward audit_event, derive rows from permission/tool events
  if(ev.type.startsWith('permission_')||ev.type==='tool_blocked'||ev.type==='tool_finished'||ev.type==='warning'){
    if(!(ev.type==='audit_event')) addAudit(deriveAudit(ev));
  }
}
function deriveAudit(ev){
  const p=ev.payload||{}, perm=p.permission;
  if(perm) return {timestamp:ev.timestamp,agent:perm.agent,action:ev.type,tool:perm.tool,status:perm.status.toLowerCase()==='pending'?'pending_approval':perm.status.toLowerCase(),user_authorization:perm.decision_transcript};
  if(ev.type==='tool_blocked') return {timestamp:ev.timestamp,agent:p.request.agent,action:p.request.operation,tool:p.request.tool,status:'blocked'};
  if(ev.type==='tool_finished') return {timestamp:ev.timestamp,agent:ev.source,action:p.operation,tool:p.tool,status:p.status};
  return {timestamp:ev.timestamp,agent:ev.source,action:p.code||ev.type,tool:'',status:'warning'};
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

$('#buttons').addEventListener('click',(e)=>{
  const btn = e.target.closest('button'); if(!btn||!state.pending||state.pending.status!=='PENDING') return;
  send({event_id:'evt_ui_'+Date.now(),type:'user_message',session_id:state.pending.session_id,source:'human',timestamp:new Date().toISOString(),
        payload:{text:btn.dataset.answer,channel:'ui',in_reply_to_permission_id:state.pending.permission_id}});
});

/* ---------- transport ---------- */
if(HUB && !params.get('demo')){
  const ws = new WebSocket(HUB);
  ws.onopen=()=>{ $('#conn').textContent='● HUB '+HUB; $('#conn').classList.add('on'); setFace('MONITORING'); };
  ws.onclose=()=>{ $('#conn').textContent='● DISCONNECTED'; $('#conn').classList.remove('on'); setFace('OFFLINE','hub connection lost'); };
  ws.onmessage=(m)=>{ try{ onEvent(JSON.parse(m.data)); }catch(err){ console.error(err); } };
  send=(ev)=>ws.readyState===1&&ws.send(JSON.stringify(ev));
} else {
  $('#conn').textContent='● DEMO MODE (no hub)';
  runDemo();
}

/* ---------- demo: same event shapes the real GREEN agent emits ---------- */
function runDemo(){
  const S='sess_demo'; let t=0; const at=(ms,fn)=>setTimeout(fn,(t+=ms));
  const E=(type,source,payload)=>onEvent({event_id:'e'+Math.random(),type,session_id:S,source,timestamp:new Date().toISOString(),payload});
  const perm={permission_id:'perm_demo',request_id:'req_demo',session_id:S,agent:'operator',tool:'docker_sandbox',operation:'create_sandbox',input:{network_access:'controlled'},reason:'validate the workshop lab',risk_level:'MEDIUM',approval_required:true,status:'PENDING',requested_at:'',prompt_for_human:''};
  send=(ev)=>{ // local human answer
    E('user_message','human',ev.payload);
    const yes=/^s[ií]$/i.test(ev.payload.text), stop=/stop/i.test(ev.payload.text);
    const p={...perm,status:yes?'GRANTED':stop?'CANCELLED':'DENIED',decided_by:'human',decision_source:'ui',decision_transcript:ev.payload.text};
    at(300,()=>{ E('agent_state_changed','security',{agent:'security',state:yes?'AUTHORIZED':'DENIED',detail:p.operation}); E(yes?'permission_granted':stop?'permission_cancelled':'permission_denied','security',{permission:p});
      E('agent_message','security',{from:'security',to:'operator',message:yes?'Autorización confirmada. Operator puede proceder.':stop?'Operación cancelada por el humano.':'Autorización denegada.',speak:true}); });
    if(yes){ at(1200,()=>{E('agent_message','operator',{from:'operator',to:'all',message:'Autorización recibida. Iniciando sandbox.',speak:true});});
             at(1800,()=>E('tool_finished','operator',{request_id:'req_demo',tool:'docker_sandbox',operation:'create_sandbox',status:'success',output:{container:'wasp-lab'}}));
             at(600,()=>E('agent_state_changed','security',{agent:'security',state:'MONITORING'})); }
    else at(3000,()=>E('agent_state_changed','security',{agent:'security',state:'MONITORING'}));
  };
  at(400,()=>E('agent_state_changed','security',{agent:'security',state:'MONITORING'}));
  at(900,()=>E('user_message','human',{text:'WASP, necesito un workshop de reconocimiento de red para principiantes.',channel:'voice'}));
  at(1200,()=>E('agent_message','architect',{from:'architect',to:'researcher',message:'Researcher, investiga ejercicios de reconocimiento de red para principiantes.',speak:true}));
  at(1800,()=>E('agent_message','researcher',{from:'researcher',to:'architect',message:'Encontré cuatro fuentes. Documentadas, no verificadas experimentalmente.',speak:true}));
  at(1400,()=>E('agent_message','architect',{from:'architect',to:'operator',message:'Operator, ¿puedes validar el ejercicio en el sandbox?',speak:true}));
  at(1300,()=>E('agent_message','operator',{from:'operator',to:'security',message:'Security, necesito autorización para crear el sandbox con red controlada.',speak:true}));
  at(700,()=>E('agent_state_changed','security',{agent:'security',state:'REVIEWING',detail:'operator: docker_sandbox'}));
  at(900,()=>{ E('agent_state_changed','security',{agent:'security',state:'PERMISSION_REQUIRED',detail:'create_sandbox'}); E('permission_requested','security',{permission:perm});
    E('agent_message','security',{from:'security',to:'operator',message:'Autorización humana requerida. Operación "create_sandbox", riesgo MEDIUM.',speak:true}); });
  at(800,()=>E('agent_message','architect',{from:'architect',to:'human',message:'¿Autorizas crear el sandbox con red controlada? Responde sí, no o stop.',speak:true}));
}
</script>
</body>
</html>
