<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WASP · ORANGE · OPERATOR</title>
<style>
  :root {
    --orange: #FF7A00;
    --orange-dim: #a24a0e;
    --orange-glow: rgba(255, 122, 0, 0.55);
    --phosphor: #ffe9d6;
    --bg: #070502;
    --panel: rgba(20, 12, 4, 0.85);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--phosphor); font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; overflow: hidden; }
  body::before { /* scanlines */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  body::after { /* vignette + flicker */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 11;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
    animation: flicker 4s infinite;
  }
  @keyframes flicker { 0%,100% { opacity: 1 } 92% { opacity: 1 } 93% { opacity: .82 } 94% { opacity: 1 } }

  .grid { display: grid; grid-template-columns: 1.1fr 1fr; grid-template-rows: 1fr 1fr; height: 100vh; gap: 14px; padding: 14px; }
  .face-wrap { grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

  svg.face { width: min(70vh, 92%); filter: drop-shadow(0 0 18px var(--orange-glow)) drop-shadow(0 0 40px var(--orange-glow)); }
  .face .stroke { fill: none; stroke: var(--phosphor); stroke-width: 3; }
  .face .eye { fill: var(--orange); }
  .face .mouth { fill: none; stroke: var(--orange); stroke-width: 4; stroke-linecap: round; }
  .face .accent { fill: var(--orange); opacity: .9; }

  .state-label { margin-top: 14px; font-size: 1.4rem; letter-spacing: .3em; color: var(--orange); text-shadow: 0 0 10px var(--orange-glow); }
  .state-detail { margin-top: 4px; font-size: .8rem; color: var(--orange-dim); min-height: 1.2em; }
  .agent-label { position: absolute; top: 10px; left: 12px; font-size: .8rem; letter-spacing: .25em; color: var(--orange-dim); }
  .conn { position: absolute; bottom: 10px; left: 12px; font-size: .75rem; letter-spacing: .15em; color: var(--orange-dim); }
  .conn.on { color: #9dff9d; }

  .win { background: var(--panel); border: 1px solid var(--orange-dim); box-shadow: 0 0 12px var(--orange-glow), inset 0 0 40px rgba(255,122,0,.05); padding: 12px 14px; overflow: hidden; display: flex; flex-direction: column; }
  .win h2 { margin: 0 0 8px; font-size: .75rem; letter-spacing: .3em; color: var(--orange); border-bottom: 1px solid var(--orange-dim); padding-bottom: 6px; }
  .win pre { margin: 0; flex: 1; overflow: auto; font-size: .82rem; line-height: 1.35; white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: .9rem; }
  .kv b { color: var(--orange-dim); font-weight: normal; }
  .ok { color: #9dff9d } .bad { color: #ff5c5c } .warn { color: #ffd166 } .dim { color: var(--orange-dim) }
  .c-architect { color: #00F0FF } .c-researcher { color: #FF2BD6 } .c-security { color: #39FF14 } .c-operator { color: var(--orange) } .c-human { color: #fff }

  /* state animations (FaceState from @wasp/shared-types) */
  .IDLE .eye { animation: blink 5s infinite; }
  .LISTENING .eye, .PREPARING .eye { animation: pulse 1.2s infinite; }
  .WAITING_FOR_PERMISSION svg.face { animation: waitglow 1s infinite alternate; }
  .EXECUTING .eye { animation: scan 0.8s infinite alternate; }
  .SUCCESS .mouth { d: path("M 115 200 Q 160 235 205 200"); }
  .WARNING .eye { fill: #ffd166 }
  .ERROR svg.face, .OFFLINE svg.face { filter: grayscale(.6) drop-shadow(0 0 10px #ff3030); }
  .ERROR .eye { fill: #ff3030 } .OFFLINE .eye { fill: #555 }
  .glitch { animation: glitch .25s steps(2) 2; }
  @keyframes blink { 0%,96%,100% { transform: scaleY(1) } 98% { transform: scaleY(.1) } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes scan { from { transform: translateX(-6px) } to { transform: translateX(6px) } }
  @keyframes waitglow { from { filter: drop-shadow(0 0 8px var(--orange-glow)) } to { filter: drop-shadow(0 0 40px var(--orange)) drop-shadow(0 0 70px var(--orange-glow)) } }
  @keyframes glitch { 0% { transform: translate(0) } 25% { transform: translate(-4px, 2px) skewX(3deg) } 50% { transform: translate(4px, -2px) skewX(-3deg) } 100% { transform: translate(0) } }
  .eye { transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body class="OFFLINE">
<div class="grid">
  <div class="face-wrap" id="faceWrap">
    <div class="agent-label">WASP // AGENT 03 // ORANGE // OPERATOR</div>
    <svg class="face" viewBox="0 0 320 320" aria-label="ORANGE operator face">
      <!-- original geometric mask: octagonal frame, hex eyes, segmented mouth -->
      <polygon class="stroke" points="80,20 240,20 300,80 300,240 240,300 80,300 20,240 20,80" />
      <polygon class="stroke" points="100,45 220,45 275,100 275,220 220,275 100,275 45,220 45,100" opacity=".45" />
      <polygon class="eye" points="95,120 125,105 155,120 155,150 125,165 95,150" />
      <polygon class="eye" points="165,120 195,105 225,120 225,150 195,165 165,150" />
      <path class="mouth" d="M 115 210 L 205 210" />
      <rect class="accent" x="150" y="60" width="20" height="6" />
      <rect class="accent" x="60" y="250" width="40" height="4" opacity=".6" />
      <rect class="accent" x="220" y="250" width="40" height="4" opacity=".6" />
    </svg>
    <div class="state-label" id="stateLabel">OFFLINE</div>
    <div class="state-detail" id="stateDetail"></div>
    <div class="conn" id="conn">● CONNECTING</div>
  </div>

  <div class="win">
    <h2>DOCKER SANDBOX</h2>
    <div class="kv" id="docker">
      <b>DOCKER</b><span class="dim">—</span>
      <b>CONTAINER</b><span class="dim">—</span>
      <b>NETWORK</b><span class="dim">—</span>
      <b>TARGET</b><span class="dim">—</span>
      <b>AGENT</b><span class="dim" id="agentProc">—</span>
    </div>
    <h2 style="margin-top:12px">RESULT</h2>
    <pre id="result" class="dim">waiting…</pre>
  </div>

  <div class="win">
    <h2>TERMINAL</h2>
    <pre id="term"></pre>
  </div>
</div>

<script>
  /* ORANGE face: a passive viewer of the shared WASP event stream (docs/CONTRACT.md).
     Connects to the hub as `operator` with meta.role = 'ui'. It never emits domain events. */
  const $ = (id) => document.getElementById(id);
  const term = $('term');
  const params = new URLSearchParams(location.search);
  const HUB = params.get('hub') || ('__WASP_HUB_URL__'.startsWith('ws') ? '__WASP_HUB_URL__' : `ws://${location.hostname}:7331`);

  function setState(s, detail) {
    document.body.className = s;
    $('stateLabel').textContent = String(s).replace(/_/g, ' ');
    $('stateDetail').textContent = detail || '';
    $('faceWrap').classList.add('glitch');
    setTimeout(() => $('faceWrap').classList.remove('glitch'), 500);
  }
  function log(line, cls) {
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.textContent = line;
    term.appendChild(el);
    while (term.children.length > 80) term.removeChild(term.firstChild);
    term.scrollTop = term.scrollHeight;
  }
  function setSandbox(s) {
    const cells = $('docker').querySelectorAll('span');
    cells[0].textContent = s.available ? `ONLINE ${s.docker_version ?? ''}` : 'OFFLINE';
    cells[0].className = s.available ? 'ok' : 'bad';
    cells[1].textContent = s.status;
    cells[1].className = s.status === 'RUNNING' ? 'ok' : s.status === 'OFFLINE' || s.status === 'ERROR' ? 'bad' : 'dim';
    cells[2].textContent = s.network === 'CONTROLLED' ? 'CONTROLLED (no egress)' : s.network;
    cells[2].className = s.network === 'CONTROLLED' ? 'ok' : s.network === 'EXTERNAL' ? 'warn' : 'dim';
    cells[3].textContent = s.target_available ? 'wasp-target UP' : 'DOWN';
    cells[3].className = s.target_available ? 'ok' : 'dim';
  }
  function setPresence(ctx) {
    const me = ctx.agents?.operator;
    const el = $('agentProc');
    if (me?.status === 'online') { el.textContent = me.mode === 'stub' ? 'ONLINE (STUB — fake Docker)' : 'ONLINE'; el.className = me.mode === 'stub' ? 'warn' : 'ok'; }
    else { el.textContent = 'OFFLINE (process not running)'; el.className = 'bad'; }
    if (ctx.sandbox) setSandbox(ctx.sandbox);
    if (ctx.agent_states?.operator) setState(ctx.agent_states.operator);
  }
  function showResult(r) {
    const cls = r.status === 'success' ? 'ok' : r.status === 'unavailable' || r.status === 'rejected' ? 'warn' : 'bad';
    const lines = [`${r.tool_id.toUpperCase()}  ${JSON.stringify(r.input ?? {})}${r.stub ? '   [STUB]' : ''}`, ''];
    const data = (r.output && r.output.data) || {};
    for (const [k, v] of Object.entries(data)) if (typeof v !== 'object') lines.push(`${k.padEnd(18)} ${v}`);
    lines.push('', r.summary ?? r.error ?? '', '', r.status.toUpperCase());
    $('result').textContent = lines.join('\n');
    $('result').className = cls;
  }

  function handle(e) {
    const p = e.payload ?? {};
    switch (e.type) {
      case 'session_snapshot': setPresence(p.context); log(`joined session ${p.context.session_id}`, 'dim'); break;
      case 'context_updated': setPresence(p.context); break;
      case 'agent_state': if (p.agent === 'operator') setState(p.state, p.detail); break;
      case 'agent_message': log(`${e.from.toUpperCase()} → ${String(e.to).toUpperCase()}: "${p.message}"`, `c-${e.from}`); break;
      case 'permission_requested': if (e.from === 'operator') log(`→ SECURITY  ${p.operation}  RISK ${p.proposed_risk ?? '?'}`, 'warn'); break;
      case 'permission_required': log(`← SECURITY  ${p.operation}  RISK ${p.risk}  ${p.approval_required ? 'HUMAN APPROVAL REQUIRED' : 'auto'}`, 'warn'); break;
      case 'permission_granted': log(`← SECURITY  AUTHORIZED ${p.operation} (${p.decided_by}${p.human_raw ? `: "${p.human_raw}"` : ''})`, 'ok'); break;
      case 'permission_denied': log(`← SECURITY  DENIED ${p.operation}`, 'bad'); break;
      case 'permission_cancelled': log(`← SECURITY  CANCELLED ${p.operation}`, 'bad'); break;
      case 'tool_started': log(`$ ${p.tool_id}`, 'ok'); break;
      case 'sandbox_test': log(`  wasp-sandbox> ${p.command}`); break;
      case 'sandbox_state': case 'sandbox_started': setSandbox(p); break;
      case 'tool_finished':
        showResult(p);
        if (p.output && p.output.stdout) String(p.output.stdout).trim().split('\n').slice(-6).forEach((l) => log('  ' + l, 'dim'));
        log(`  ${p.status.toUpperCase()}  ${p.summary ?? p.error ?? ''}`, p.status === 'success' ? 'ok' : 'bad');
        break;
      case 'validation_result': log(`validation_result → validated=${p.validated}${p.stub ? ' [STUB]' : ''}: ${p.summary}`, p.validated ? 'ok' : 'warn'); break;
      case 'warning': log(`⚠ ${p.message}`, 'warn'); break;
      case 'error': log(`✖ ${p.message ?? JSON.stringify(p)}`, 'bad'); break;
      case 'hub_error': log(`HUB: ${p.message}`, 'bad'); break;
    }
  }

  function connect() {
    const ws = new WebSocket(HUB);
    ws.onopen = () => {
      // First frame must be agent_registered (docs/CONTRACT.md §2). role: 'ui' → viewer, not presence.
      ws.send(JSON.stringify({ type: 'agent_registered', from: 'operator', to: 'hub', payload: { agent: 'operator', mode: 'real', meta: { role: 'ui' } } }));
      $('conn').textContent = `● HUB ${HUB}`; $('conn').className = 'conn on';
    };
    ws.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (err) { console.error(err); } };
    ws.onclose = () => { setState('OFFLINE', 'hub connection lost'); $('conn').textContent = '● DISCONNECTED — retrying'; $('conn').className = 'conn'; setTimeout(connect, 1500); };
  }
  connect();
</script>
</body>
</html>
